<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="サロン助手">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>サロン助手</title>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="top-title">
      <h1 id="title">サロン助手</h1>
      <p id="sub" class="muted">読み込み中…</p>
    </div>
  </div>
</header>

<main>
  <section id="view-rank" class="view"></section>
  <section id="view-kw" class="view"></section>
  <section id="view-style" class="view"></section>
  <section id="view-blog" class="view"></section>
  <section id="view-set" class="view"></section>
</main>

<nav class="tabbar" role="tablist">
  <button class="tab" data-view="rank" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10m6 9V5m6 14v-7m4 7H2" /></svg>ランキング</button>
  <button class="tab" data-view="kw" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10l6 5-6 5H4z" /><circle cx="8.5" cy="12" r="1.3" /></svg>キーワード</button>
  <button class="tab" data-view="style" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.6" /><circle cx="6" cy="17" r="2.6" /><path d="M8.2 8.4 20 17M8.2 15.6 20 7" /></svg>スタイル</button>
  <button class="tab" data-view="blog" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z" /><path d="M8 11h8M8 15h8M8 7h4" /></svg>ブログ</button>
  <button class="tab" data-view="set" role="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1" /></svg>設定</button>
</nav>

<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
